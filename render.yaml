services:
  - type: web
    name: nexgas-backend
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_PROTOCOL
        value: mqtt
      - key: MQTT_CLIENT_ID_PREFIX
        value: nexgas-backend-cloud
      - key: MQTT_CONNECT_ON_STARTUP
        value: "true"
      - key: PUBLIC_MQTT_TEST_MODE
        value: "true"
      - key: DEFAULT_DEVICE_ID
        value: nexgas-001
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none

